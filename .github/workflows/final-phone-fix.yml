name: final-phone-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix imports and app auto-link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/messages/som/MainActivity.kt')
          s = p.read_text()
          if 'import com.messages.som.data.AppMessagingRepository' not in s:
              s = s.replace('import androidx.core.content.ContextCompat\n', 'import androidx.core.content.ContextCompat\nimport com.messages.som.data.AppMessagingRepository\nimport com.messages.som.data.PhoneNumberAutoLinker\n')
          p.write_text(s)

          p = Path('app/src/main/java/com/messages/som/AppMessagesActivity.kt')
          s = p.read_text()
          marker = 'var results by remember { mutableStateOf<List<AppMessagingRepository.AppProfile>>(emptyList()) }'
          if 'PhoneNumberAutoLinker.sync(activity, repo)' not in s and marker in s:
              insert = '''\n\n    LaunchedEffect(profile?.uid) {\n        val current = profile ?: return@LaunchedEffect\n        if (current.phoneNumber.isBlank() && ContextCompat.checkSelfPermission(activity, Manifest.permission.READ_PHONE_NUMBERS) == PackageManager.PERMISSION_GRANTED) {\n            PhoneNumberAutoLinker.sync(activity, repo)\n            DevicePhoneNumber.read(activity)?.let { detected -> profile = current.copy(phoneNumber = detected) }\n        }\n    }'''
              s = s.replace(marker, marker + insert)
          if 'import android.Manifest' not in s:
              s = s.replace('package com.messages.som\n', 'package com.messages.som\n\nimport android.Manifest\nimport android.content.pm.PackageManager\n')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/messages/som/MainActivity.kt app/src/main/java/com/messages/som/AppMessagesActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(android): complete phone auto-link integration'
          git push origin main
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/final-phone-fix.yml
          git commit -m 'chore: remove final phone fix workflow'
          git push origin main
